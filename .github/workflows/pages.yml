# Builds the website from html/ into _site/ (English plus a page per language, see
# .github/scripts/site-i18n.mjs) and publishes it to GitHub Pages whenever it changes on main.
# Pull requests only check the translations, so a stale one is caught before merging.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "html/**"
      - "lang/**"
      - ".github/scripts/site-i18n.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "html/**"
      - "lang/**"
      - ".github/scripts/site-i18n.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the translations
        run: node .github/scripts/site-i18n.mjs --check

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site in every language
        run: node .github/scripts/site-i18n.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # a job of its own, as in GitHub's Pages template: deploying in the same job as the upload
  # can look for the artifact before GitHub lists it, and fail with "No artifacts found"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
